[project]
name = "django-shop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Павел", email = "Besp.Pavel@mail.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "dj-database-url>=3.1.2",
    "django>=6.1.1",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "whitenoise>=6.12.0",
]

[project.scripts]
django-shop = "django_shop:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.9",
]

[tool.coverage.run]
branch = true
omit = [
    "*/migrations/*",
    "manage.py",
    "config/wsgi.py",
    "config/asgi.py",
    "tests/*",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false